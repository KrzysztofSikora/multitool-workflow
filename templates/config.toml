# Edit in the application repo. No secrets here. Commands are trusted project code.
[codex]
# Empty = use the configured CLI default; no hard-coded model identifiers.
model = ""
# Example, after checking your installed CLI: extra_args = ["--approve-for-me"]
extra_args = []

[claude]
model = ""
permission_mode = "auto"
extra_args = []

[gates]
# Fill with real commands for your application before running ship.
fast = []
final = []

[mutation]
enabled = false
reason = "Not configured yet; choose mutation targets and commands during test-plan."
# When enabled, the runner executes these commands before asking for the mutation report.
commands = []

[preflight]
# Optional project checks executed before sessions and gates; fail non-zero to block.
# For Android, implement a fail-closed check for physical devices and the guardian AVD.
commands = []

[limits]
step_timeout = 1800
gate_timeout = 900
plan_review_rounds = 2
review_rounds = 2
max_phases = 12
